version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: helm
      POSTGRES_PASSWORD: helm
      POSTGRES_DB: helm
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helm"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
  api:
    build: .
    command: ["node", "dist/main.js"]
    env_file: [.env]
    depends_on: { postgres: { condition: service_healthy }, redis: {} }
    ports: ["3000:3000"]
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: [.env]
    depends_on: { postgres: { condition: service_healthy }, redis: {} }
volumes:
  pgdata: {}
  redisdata: {}
