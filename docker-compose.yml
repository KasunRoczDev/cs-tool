services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitoring
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://monitor:monitor@db:5432/monitoring
      JWT_SECRET: change-me-to-a-long-random-string
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-https://cs.oms.parallaxtec.dev}
      SCHEMA_PATH: /app/database/schema.sql
      PRODUCTS_MIGRATION_PATH: /app/database/products_migration.sql
      SETTINGS_MIGRATION_PATH: /app/database/settings_migration.sql
      NOTIF_MIGRATION_PATH: /app/database/notifications_migration.sql
      TOPOLOGY_MIGRATION_PATH: /app/database/topology_migration.sql
      MFA_MIGRATION_PATH: /app/database/mfa_migration.sql
      RELEASE_MIGRATION_PATH: /app/database/release_migration.sql
      REPO_TOKEN_MIGRATION_PATH: /app/database/repo_github_token_migration.sql
      DEPLOY_JOBS_MIGRATION_PATH: /app/database/deploy_jobs_migration.sql
      APPROVALS_MIGRATION_PATH: /app/database/release_approvals_migration.sql
      RBAC_MIGRATION_PATH: /app/database/rbac_migration.sql
      TRUSTED_DEVICES_MIGRATION_PATH: /app/database/trusted_devices_migration.sql
      WEBAUTHN_MIGRATION_PATH: /app/database/webauthn_migration.sql
      # Must match the real domain the dashboard is served from in production
      # (e.g. WEBAUTHN_RP_ID=cs.oms.parallaxtec.dev, WEBAUTHN_ORIGIN=https://cs.oms.parallaxtec.dev)
      # or the browser rejects passkey requests with "'rp.id' cannot be used
      # with the current origin". Set these in a .env file next to this compose
      # file rather than editing the defaults below.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-cs.oms.parallaxtec.dev}
      WEBAUTHN_RP_NAME: Monitoring Platform
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-https://cs.oms.parallaxtec.dev}
      # Key used to encrypt per-repo GitHub tokens at rest (AES-256-GCM).
      # Change this to a long random string; rotating it invalidates stored tokens.
      TOKEN_ENC_KEY: change-me-to-a-long-random-token-encryption-key
      # ── AI Assistant LLM enrichment (optional — scores work without it) ──
      # AI_PROVIDER: anthropic        # or: openai
      # AI_API_KEY: your-llm-api-key
      # AI_MODEL: claude-3-5-haiku-latest   # or: gpt-4o-mini
      # ── Email notifications (set these to enable) ──────────────────────
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: 587
      # SMTP_SECURE: "false"
      # SMTP_USER: monitor@example.com
      # SMTP_PASS: your-smtp-password
      # SMTP_FROM: monitor@example.com
    ports:
      - "4000:4000"
    volumes:
      # Mount the schema so migrate.js can apply it (build context can't reach ../database).
      - ./database/schema.sql:/app/database/schema.sql:ro
      - ./database/products_migration.sql:/app/database/products_migration.sql:ro
      - ./database/notifications_migration.sql:/app/database/notifications_migration.sql:ro
      - ./database/settings_migration.sql:/app/database/settings_migration.sql:ro
      - ./database/topology_migration.sql:/app/database/topology_migration.sql:ro
      - ./database/mfa_migration.sql:/app/database/mfa_migration.sql:ro
      - ./database/release_migration.sql:/app/database/release_migration.sql:ro
      - ./database/repo_github_token_migration.sql:/app/database/repo_github_token_migration.sql:ro
      - ./database/deploy_jobs_migration.sql:/app/database/deploy_jobs_migration.sql:ro
      - ./database/release_approvals_migration.sql:/app/database/release_approvals_migration.sql:ro
      - ./database/rbac_migration.sql:/app/database/rbac_migration.sql:ro
      - ./database/trusted_devices_migration.sql:/app/database/trusted_devices_migration.sql:ro
      - ./database/webauthn_migration.sql:/app/database/webauthn_migration.sql:ro
    depends_on:
      db:
        condition: service_healthy
    # Apply schema + seed admin, then start the API.
    command: sh -c "node scripts/migrate.js && node dist/main.js"

  dashboard:
    build:
      context: ./dashboard
      args:
        # Baked into the build so Next's external rewrite points at the backend service.
        BACKEND_URL: http://backend:4000
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dbdata:
